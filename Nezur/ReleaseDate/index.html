<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA Premium Countdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6C5CE7;
            --secondary: #FD79A8;
            --dark: #2D3436;
            --light: #F5F6FA;
            --accent: #00CEFF;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--dark), #1E272E);
            color: var(--light);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .container {
            width: 95%;
            max-width: 1200px;
            background: rgba(45, 52, 54, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
            overflow: hidden;
            position: relative;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            animation: rotate 20s linear infinite;
            z-index: -1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .countdown {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }
        
        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            min-width: 180px;
        }
        
        .countdown-card {
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transform-style: preserve-3d;
            transition: all 0.5s ease;
            margin-bottom: 1.5rem;
        }
        
        .countdown-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }
        
        .countdown-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }
        
        .countdown-card:hover::before {
            transform: translateX(100%);
        }
        
        .countdown-value {
            font-size: 4.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            position: relative;
            z-index: 1;
        }
        
        .countdown-label {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.7;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        
        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        .progress-ring-circle {
            stroke: url(#gradient);
            stroke-width: 6;
            stroke-linecap: round;
            fill: none;
            transition: stroke-dashoffset 0.5s ease;
        }
        
        .progress-ring-bg {
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 6;
            fill: none;
        }
        
        .release-info {
            text-align: center;
            margin-top: 2rem;
            font-size: 1.2rem;
            opacity: 0.8;
            line-height: 1.6;
        }
        
        .highlight {
            color: var(--accent);
            font-weight: 600;
        }
        
        .expired {
            text-align: center;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 2rem 0;
            display: none;
            animation: pulse 2s infinite;
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: var(--accent);
            opacity: 0;
            z-index: 100;
            animation: confetti 5s ease-in-out;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotateY(0deg);
            }
            50% {
                transform: translateY(-20px) rotateY(5deg);
            }
        }
        
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        @keyframes confetti {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(1000px) rotate(720deg);
                opacity: 0;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 2rem 1.5rem;
            }
            
            .title {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .countdown {
                gap: 1rem;
            }
            
            .countdown-item {
                min-width: 120px;
            }
            
            .countdown-card {
                width: 120px;
                height: 120px;
            }
            
            .countdown-value {
                font-size: 3rem;
            }
            
            .countdown-label {
                font-size: 0.9rem;
            }
            
            .expired {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js" class="particles"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">Release Countdown</h1>
            <p class="subtitle">The wait is almost over</p>
        </div>
        
        <div class="countdown" id="countdown">
            <!-- Filled by JavaScript -->
        </div>
        
        <div id="expired" class="expired">
            IT'S HERE! 🎉
        </div>
        
        <div class="release-info">
            <p>Release scheduled for <span id="release-date" class="highlight"></span></p>
            <p><span id="time-left" class="highlight"></span> remaining</p>
        </div>
        
        <svg width="0" height="0">
            <defs>
                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#6C5CE7" />
                    <stop offset="100%" stop-color="#00CEFF" />
                </linearGradient>
            </defs>
        </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Target time: April 5, 2025 (1744420500 epoch)
        const targetTime = 1744420500 * 1000;
        const countdownElement = document.getElementById('countdown');
        const expiredElement = document.getElementById('expired');
        const releaseDateElement = document.getElementById('release-date');
        const timeLeftElement = document.getElementById('time-left');
        
        // Initialize particles.js
        particlesJS('particles-js', {
            particles: {
                number: { value: 80, density: { enable: true, value_area: 800 } },
                color: { value: "#6C5CE7" },
                shape: { type: "circle" },
                opacity: { value: 0.5, random: true },
                size: { value: 3, random: true },
                line_linked: { enable: true, distance: 150, color: "#6C5CE7", opacity: 0.3, width: 1 },
                move: { enable: true, speed: 2, direction: "none", random: true, straight: false, out_mode: "out" }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "repulse" },
                    onclick: { enable: true, mode: "push" }
                }
            }
        });
        
        // Format release date
        const releaseDate = new Date(targetTime);
        const options = { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric', 
            hour: '2-digit', 
            minute: '2-digit',
            timeZoneName: 'short'
        };
        releaseDateElement.textContent = releaseDate.toLocaleDateString('en-US', options);
        
        function updateCountdown() {
            const now = new Date().getTime();
            const diff = targetTime - now;
            
            if (diff <= 0) {
                countdownElement.style.display = 'none';
                expiredElement.style.display = 'block';
                timeLeftElement.textContent = "0 days, 0 hours, 0 minutes";
                createConfetti();
                return;
            }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            // Update time left text
            timeLeftElement.textContent = `${days} days, ${hours} hours, ${minutes} minutes`;
            
            // Calculate percentages for progress rings
            const daysPercent = (days / 365) * 100;
            const hoursPercent = (hours / 24) * 100;
            const minutesPercent = (minutes / 60) * 100;
            const secondsPercent = (seconds / 60) * 100;
            
            // Calculate circumference for progress rings (2πr)
            const radius = 80;
            const circumference = 2 * Math.PI * radius;
            
            countdownElement.innerHTML = `
                <div class="countdown-item">
                    <div class="countdown-card">
                        <svg class="progress-ring" width="180" height="180">
                            <circle class="progress-ring-bg" stroke-width="6" fill="transparent" r="${radius}" cx="90" cy="90"/>
                            <circle class="progress-ring-circle" stroke-width="6" fill="transparent" r="${radius}" cx="90" cy="90" 
                                    stroke-dasharray="${circumference}" 
                                    stroke-dashoffset="${circumference - (daysPercent / 100 * circumference)}"/>
                        </svg>
                        <div class="countdown-value">${days}</div>
                    </div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-card">
                        <svg class="progress-ring" width="180" height="180">
                            <circle class="progress-ring-bg" stroke-width="6" fill="transparent" r="${radius}" cx="90" cy="90"/>
                            <circle class="progress-ring-circle" stroke-width="6" fill="transparent" r="${radius}" cx="90" cy="90" 
                                    stroke-dasharray="${circumference}" 
                                    stroke-dashoffset="${circumference - (hoursPercent / 100 * circumference)}"/>
                        </svg>
                        <div class="countdown-value">${hours}</div>
                    </div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-card">
                        <svg class="progress-ring" width="180" height="180">
                            <circle class="progress-ring-bg" stroke-width="6" fill="transparent" r="${radius}" cx="90" cy="90"/>
                            <circle class="progress-ring-circle" stroke-width="6" fill="transparent" r="${radius}" cx="90" cy="90" 
                                    stroke-dasharray="${circumference}" 
                                    stroke-dashoffset="${circumference - (minutesPercent / 100 * circumference)}"/>
                        </svg>
                        <div class="countdown-value">${minutes}</div>
                    </div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-card">
                        <svg class="progress-ring" width="180" height="180">
                            <circle class="progress-ring-bg" stroke-width="6" fill="transparent" r="${radius}" cx="90" cy="90"/>
                            <circle class="progress-ring-circle" stroke-width="6" fill="transparent" r="${radius}" cx="90" cy="90" 
                                    stroke-dasharray="${circumference}" 
                                    stroke-dashoffset="${circumference - (secondsPercent / 100 * circumference)}"/>
                        </svg>
                        <div class="countdown-value">${seconds}</div>
                    </div>
                    <div class="countdown-label">Seconds</div>
                </div>
            `;
        }
        
        function createConfetti() {
            const colors = ['#6C5CE7', '#00CEFF', '#FD79A8', '#00B894', '#FDCB6E'];
            
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = Math.random() * 10 + 5 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                confetti.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(confetti);
                
                // Remove confetti after animation
                setTimeout(() => {
                    confetti.remove();
                }, 7000);
            }
        }
        
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
