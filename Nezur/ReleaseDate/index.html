<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5E35B1;
            --secondary: #3949AB;
            --accent: #00ACC1;
            --dark: #121212;
            --light: #FAFAFA;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.7);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1A237E, #000000);
            color: var(--light);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .container {
            width: 95%;
            max-width: 900px;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(94, 53, 177, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            animation: rotate 30s linear infinite;
            z-index: -1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 3.5rem;
            position: relative;
        }
        
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            font-weight: 700;
            color: var(--light);
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
            position: relative;
            display: inline-block;
        }
        
        .title::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-top: 1.5rem;
            color: var(--text-secondary);
        }
        
        .countdown {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }
        
        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            min-width: 140px;
        }
        
        .countdown-card {
            width: 140px;
            height: 140px;
            background: var(--card-bg);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .countdown-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .countdown-value {
            font-size: 3.2rem;
            font-weight: 600;
            font-family: 'Playfair Display', serif;
            color: var(--light);
            position: relative;
            z-index: 1;
        }
        
        .countdown-label {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
            margin-top: 0.3rem;
            color: var(--text-secondary);
        }
        
        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        .progress-ring-circle {
            stroke: var(--accent);
            stroke-width: 4;
            stroke-linecap: round;
            fill: none;
            transition: stroke-dashoffset 0.5s ease;
            opacity: 0.8;
        }
        
        .progress-ring-bg {
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 4;
            fill: none;
        }
        
        .release-info {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        
        .highlight {
            color: var(--accent);
            font-weight: 500;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
        }
        
        .expired {
            text-align: center;
            font-size: 2.8rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            color: var(--light);
            margin: 2rem 0;
            display: none;
            animation: pulse 1.5s infinite;
        }
        
        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            background: var(--accent);
            opacity: 0;
            z-index: 100;
            animation: confetti 4s ease-in-out;
            border-radius: 50%;
        }
        
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }
        }
        
        @keyframes confetti {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(800px) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 2.5rem 1.5rem;
                border-radius: 20px;
            }
            
            .title {
                font-size: 2.4rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .countdown {
                gap: 1rem;
            }
            
            .countdown-item {
                min-width: 100px;
            }
            
            .countdown-card {
                width: 100px;
                height: 100px;
            }
            
            .countdown-value {
                font-size: 2.4rem;
            }
            
            .countdown-label {
                font-size: 0.85rem;
            }
            
            .expired {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js" class="particles"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">Countdown</h1>
            <p class="subtitle">Until the special moment arrives</p>
        </div>
        
        <div class="countdown" id="countdown">
            <!-- Filled by JavaScript -->
        </div>
        
        <div id="expired" class="expired">
            The Moment Has Arrived
        </div>
        
        <div class="release-info">
            <p>Target date: <span id="release-date" class="highlight"></span></p>
            <p><span id="time-left" class="highlight"></span> remaining</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Target time: April 5, 2025 18:00:00 GMT (1744423200 epoch)
        const targetTime = 1744423200 * 1000;
        const countdownElement = document.getElementById('countdown');
        const expiredElement = document.getElementById('expired');
        const releaseDateElement = document.getElementById('release-date');
        const timeLeftElement = document.getElementById('time-left');
        
        // Initialize particles.js with clean configuration
        particlesJS('particles-js', {
            particles: {
                number: { 
                    value: 60, 
                    density: { 
                        enable: true, 
                        value_area: 800 
                    } 
                },
                color: { 
                    value: "#5E35B1" 
                },
                shape: { 
                    type: "circle"
                },
                opacity: {
                    value: 0.5,
                    random: true
                },
                size: {
                    value: 3,
                    random: true
                },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: "#5E35B1",
                    opacity: 0.2,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 1,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out"
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: {
                        enable: true,
                        mode: "repulse"
                    }
                }
            }
        });
        
        // Format release date
        const releaseDate = new Date(targetTime);
        const options = { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric', 
            hour: '2-digit', 
            minute: '2-digit',
            timeZoneName: 'short'
        };
        releaseDateElement.textContent = releaseDate.toLocaleDateString('en-US', options);
        
        function updateCountdown() {
            const now = new Date().getTime();
            const diff = targetTime - now;
            
            if (diff <= 0) {
                countdownElement.style.display = 'none';
                expiredElement.style.display = 'block';
                timeLeftElement.textContent = "0 days, 0 hours, 0 minutes";
                createConfetti();
                return;
            }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            // Update time left text
            timeLeftElement.textContent = `${days} days, ${hours} hours, ${minutes} minutes`;
            
            // Calculate percentages for progress rings
            const daysPercent = (days / 365) * 100;
            const hoursPercent = (hours / 24) * 100;
            const minutesPercent = (minutes / 60) * 100;
            const secondsPercent = (seconds / 60) * 100;
            
            // Calculate circumference for progress rings (2πr)
            const radius = 60;
            const circumference = 2 * Math.PI * radius;
            
            countdownElement.innerHTML = `
                <div class="countdown-item">
                    <div class="countdown-card">
                        <svg class="progress-ring" width="140" height="140">
                            <circle class="progress-ring-bg" stroke-width="4" fill="transparent" r="${radius}" cx="70" cy="70"/>
                            <circle class="progress-ring-circle" stroke-width="4" fill="transparent" r="${radius}" cx="70" cy="70" 
                                    stroke-dasharray="${circumference}" 
                                    stroke-dashoffset="${circumference - (daysPercent / 100 * circumference)}"/>
                        </svg>
                        <div class="countdown-value">${days}</div>
                    </div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-card">
                        <svg class="progress-ring" width="140" height="140">
                            <circle class="progress-ring-bg" stroke-width="4" fill="transparent" r="${radius}" cx="70" cy="70"/>
                            <circle class="progress-ring-circle" stroke-width="4" fill="transparent" r="${radius}" cx="70" cy="70" 
                                    stroke-dasharray="${circumference}" 
                                    stroke-dashoffset="${circumference - (hoursPercent / 100 * circumference)}"/>
                        </svg>
                        <div class="countdown-value">${hours}</div>
                    </div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-card">
                        <svg class="progress-ring" width="140" height="140">
                            <circle class="progress-ring-bg" stroke-width="4" fill="transparent" r="${radius}" cx="70" cy="70"/>
                            <circle class="progress-ring-circle" stroke-width="4" fill="transparent" r="${radius}" cx="70" cy="70" 
                                    stroke-dasharray="${circumference}" 
                                    stroke-dashoffset="${circumference - (minutesPercent / 100 * circumference)}"/>
                        </svg>
                        <div class="countdown-value">${minutes}</div>
                    </div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-card">
                        <svg class="progress-ring" width="140" height="140">
                            <circle class="progress-ring-bg" stroke-width="4" fill="transparent" r="${radius}" cx="70" cy="70"/>
                            <circle class="progress-ring-circle" stroke-width="4" fill="transparent" r="${radius}" cx="70" cy="70" 
                                    stroke-dasharray="${circumference}" 
                                    stroke-dashoffset="${circumference - (secondsPercent / 100 * circumference)}"/>
                        </svg>
                        <div class="countdown-value">${seconds}</div>
                    </div>
                    <div class="countdown-label">Seconds</div>
                </div>
            `;
        }
        
        function createConfetti() {
            const colors = ['#5E35B1', '#00ACC1', '#3949AB', '#00897B', '#7E57C2'];
            
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.width = Math.random() * 12 + 5 + 'px';
                confetti.style.height = Math.random() * 12 + 5 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                confetti.style.animationDelay = Math.random() * 5 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(confetti);
                
                // Remove confetti after animation
                setTimeout(() => {
                    confetti.remove();
                }, 7000);
            }
        }
        
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
